repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        name: end-of-file-fixer
        exclude: |
          (?x)^(
            # Exclude external files:
            doc/www/_static/tex-mml-chtml.js |
            doc/www/contribute/guidelines/GRIB2_record_and_ecCodes.svg
          )$
      - id: trailing-whitespace
        name: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: |
          (?x)^(
            # Exclude external files:
            LICENSES/.* |
            doc/www/_static/tex-mml-chtml.js |
            doc/www/howto/wf.svg |
            doc/www/contribute/guidelines/GRIB2_record_and_ecCodes.svg
          )$
      - id: check-executables-have-shebangs
        name: check-executables-have-shebangs
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        args:
          - --in-place
          - --dangle-parens=True
          - --max-lines-hwrap=0
          - --keyword-case=upper
          - --autosort=True
          - --first-comment-is-literal=True
        exclude: |
          (?x)^(
            # Exclude external files:
            test/microphysics_1mom_schemes/cmake/Modules/FindNetCDF.cmake
          )$
  - repo: https://gitlab.dkrz.de/icon/ci-tooling/icon-openacc-beautifier
    rev: v1.1.0
    hooks:
      - id: icon-openacc-beautifier
  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: [--profile=black, --line-length=80]
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 25.9.0
    hooks:
      - id: black
        args: [--line-length=80]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.1
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        exclude: |
          (?x)^(
            # Exclude .h files that are not C/C++ headers:
            schedulers/ecmwf/include/.*\.h
          )$
      - id: clang-format
        name: clang-format (templates)
        types_or: []
        types: [text]
        files: '.*\.ipp$'
  - repo: https://gitlab.dkrz.de/icon/ci-tooling/codee-precommit
    rev: v2025.4.5
    hooks:
      - id: codee-format-safe
        args: [--on-error, skip, --extensions, "f90,F90,inc,incf"]
        types: [file]
        files: |
          (?x)^(
            # Apply to selected directories only:
            ragnarok |
            test/unit-tests |
            src/physics_granules/cldcov_koe |
            src/physics_granules/common |
            src/upatmo
          )/.*\.([fF]\d*|incf?)$ |
          ^(
            # Apply to selected files only:
            src/shr_horizontal/mo_rbf_coefficients_io.f90 |
            src/atm_phy_schemes/mo_eclipse.f90 |
            src/shared/mo_compare_float.f90 |
            src/atm_phy_nwp/mo_nwp_cldcov_interface.f90 |
            src/atm_phy_nwp/mo_nwp_cldcov_koe_driver.f90 |
            src/atm_phy_schemes/mo_fsd.f90 |
            src/atm_phy_schemes/mo_cloud_cover.f90 |
            src/atm_phy_nwp/mo_.*ecrad.*\.f90 |
            src/atm_phy_nwp/mo_nwp_aerosol.f90 |
            src/atm_phy_nwp/mo_nwp_rad_interface.f90
          )$
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
        stages: [manual]
        always_run: true
        verbose: true
