[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chilitest"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "xarray",
    "matplotlib",
    "jinja2",
    # ICON/CDI output is blosc-compressed netCDF4; the plain netcdf4 backend
    # needs the hdf5plugin package to decode it.
    "netcdf4",
    "hdf5plugin",
]

[tool.setuptools.packages.find]
where = ["."]
