# Sets environment variable ICON_CI_UTILS_GIT_IGNORE_PATH that points to a
# directory ignored by git.
#
# Useful for jobs that generate artifacts or caches, but are sensitive to
# untracked files in the repository clone.
#
.utils:git:ignore:
  variables:
    ICON_CI_UTILS_GIT_IGNORE_PATH: ${CI_PROJECT_DIR}/.ci_dir

# Implements a before_script that clones the project repository
# $CI_REPOSITORY_URL to any specified path $ICON_CI_UTILS_GIT_CLONE_PATH. In
# contrast to the standard $GIT_CLONE_PATH, $ICON_CI_UTILS_GIT_CLONE_PATH does
# not have to point to a subdirectory of $CI_BUILDS_DIR.
#
# By default, the before_script prepares the build directory in the same way as
# GitLab runners normally do when the GIT_STRATEGY is set to 'clone'. The script
# also supports the following standard variables
# (see https://docs.gitlab.com/ci/runners/configure_runners/#configure-runner-behavior-with-variables):
#   - GIT_STRATEGY (defaults to `empty`): if set to `none`, all git operations
#     are skipped (any other value of the variable does not affect the logic of
#     the before_script);
#   - GIT_SUBMODULE_STRATEGY (defaults to `none`);
#   - GIT_CHECKOUT (defaults to `true`);
#   - GIT_FETCH_EXTRA_FLAGS (defaults to `--quiet`);
#   - GIT_SUBMODULE_UPDATE_FLAGS (defaults to an empty string);
#   - GIT_DEPTH (defaults to `20`);
#   - GIT_SUBMODULE_DEPTH (defaults to `$GIT_DEPTH`);
#   - GIT_SUBMODULE_PATHS (defaults to an empty string).
#
# The main difference of the default behaviour is that all git operations are
# run as part of the job, which means that jobs that extend the template must
# ensure that their runtime environments enable the git command.
#
.utils:git:clone:
  extends: .utils:git:ignore
  variables:
    # Path to the directory to clone the repository in (does not have to exist
    # before running the script, but must be empty if it does):
    ICON_CI_UTILS_GIT_CLONE_PATH: ${CI_PROJECT_DIR}

    # URL of the repository to clone:
    ICON_CI_UTILS_GIT_REPOSITORY_URL: ${CI_REPOSITORY_URL}

    # Space-separated list of git refspecs to fetch (when null or empty,
    # defaults to the list of specs generated by GitLab, which slightly differs
    # from the documented at https://docs.gitlab.com/ci/pipelines/#ref-specs-for-runners):
    ICON_CI_UTILS_GIT_REFSPECS: null

    # Space-separated list of patterns for the sparse checkout in non-cone mode
    # (see https://git-scm.com/docs/git-sparse-checkout):
    ICON_CI_UTILS_GIT_SPARSE_PATTERNS: null

    # Internal variables:
    GIT_STRATEGY: empty
  before_script:
    - |
      # !reference [.utils:git:clone, before_script]
      (
        set -u

        # Default values:
        GIT_STRATEGY=${GIT_STRATEGY:-none}
        GIT_SUBMODULE_STRATEGY=${GIT_SUBMODULE_STRATEGY:-none}
        GIT_CHECKOUT=${GIT_CHECKOUT:-true}
        GIT_FETCH_EXTRA_FLAGS=${GIT_FETCH_EXTRA_FLAGS:---quiet}
        GIT_DEPTH=${GIT_DEPTH:-20}
        GIT_SUBMODULE_DEPTH=${GIT_SUBMODULE_DEPTH:-${GIT_DEPTH}}
        ICON_CI_UTILS_GIT_REFSPECS=${ICON_CI_UTILS_GIT_REFSPECS:-" \
          +refs/pipelines/${CI_PIPELINE_ID}:refs/pipelines/${CI_PIPELINE_ID} \
          ${CI_COMMIT_BRANCH:+"+refs/heads/${CI_COMMIT_BRANCH}:refs/remotes/origin/${CI_COMMIT_BRANCH}"} \
          ${CI_COMMIT_TAG:+"+refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}"} \
        "}
        test recursive = "${GIT_SUBMODULE_STRATEGY}" && \
          submodule_recursive_flag='--recursive' || \
          submodule_recursive_flag=
        artifacts_backup_path="${ICON_CI_UTILS_GIT_IGNORE_PATH}/artifacts"

        test none = "${GIT_STRATEGY}" && {
          icon_ci_log_status_msg 'Skipping Git repository setup'
          GIT_SUBMODULE_STRATEGY=none
          GIT_CHECKOUT=false
          ICON_CI_UTILS_GIT_SPARSE_PATTERNS=
        } || {
          # Sanity checks:
          git --version 2>/dev/null || {
            icon_ci_log_fatal_msg 'git command is not available'
          }
          test ! -d "${ICON_CI_UTILS_GIT_CLONE_PATH}" || {
            git_toplevel=$(git -C "${ICON_CI_UTILS_GIT_CLONE_PATH}" rev-parse --show-toplevel 2>/dev/null)
            test "${ICON_CI_UTILS_GIT_CLONE_PATH}" != "${git_toplevel}"
          } || {
            icon_ci_log_fatal_msg "'${ICON_CI_UTILS_GIT_CLONE_PATH}' is an existing git repository"
          }
          test ! -d "${artifacts_backup_path}" || {
            icon_ci_log_fatal_msg "'${artifacts_backup_path}' unexpectedly exists"
          }

          icon_ci_log_section_start \
            "Cloning '${ICON_CI_UTILS_GIT_REPOSITORY_URL}' to '${ICON_CI_UTILS_GIT_CLONE_PATH}'"

          # If we clone to $CI_PROJECT_DIR and it is not empty, we assume the
          # the contents are artifacts. To avoid collisions when cloning, we
          # temporarily move artifacts to a subdirectory:
          test "${ICON_CI_UTILS_GIT_CLONE_PATH}" != "${CI_PROJECT_DIR}" || \
            test -z "$(ls -A "${CI_PROJECT_DIR}" 2>/dev/null)" || {
            icon_ci_log_status_msg 'Backing up artifacts before the cloning...'
            (
              set -x
              mkdir -p "${artifacts_backup_path}"
              find "${CI_PROJECT_DIR}" -mindepth 1 -maxdepth 1 \
                -path "${ICON_CI_UTILS_GIT_IGNORE_PATH}" -prune -o \
                -exec mv -v '{}' "${artifacts_backup_path}/" ';'
            ) 2>&1
          }

          icon_ci_log_status_msg "Fetching changes with git depth set to ${GIT_DEPTH}..."
          (
            set -x
            git -c 'init.defaultBranch=none' init --template='' "${ICON_CI_UTILS_GIT_CLONE_PATH}"
            git -C "${ICON_CI_UTILS_GIT_CLONE_PATH}" \
              remote add origin "${ICON_CI_UTILS_GIT_REPOSITORY_URL}"
            git -C "${ICON_CI_UTILS_GIT_CLONE_PATH}" \
              fetch origin --no-recurse-submodules ${ICON_CI_UTILS_GIT_REFSPECS} \
              --depth "${GIT_DEPTH}" ${GIT_FETCH_EXTRA_FLAGS}
          ) 2>&1
        }

        test -z "${ICON_CI_UTILS_GIT_SPARSE_PATTERNS-}" && {
          icon_ci_log_status_msg 'Skipping Git sparse checkout configuration'
        } || (
          icon_ci_log_status_msg 'Applying Git sparse checkout configuration...'
          set -x
          git -C "${ICON_CI_UTILS_GIT_CLONE_PATH}" \
            sparse-checkout set --no-cone -- ${ICON_CI_UTILS_GIT_SPARSE_PATTERNS}
        ) 2>&1

        test false = "${GIT_CHECKOUT}" && {
          icon_ci_log_status_msg 'Skipping Git checkout'
        } || (
          icon_ci_log_status_msg \
            "Checking out ${CI_COMMIT_SHORT_SHA} as detached HEAD (ref is ${CI_COMMIT_REF_NAME})..."
          set -x
          git -C "${ICON_CI_UTILS_GIT_CLONE_PATH}" \
            -c advice.detachedHEAD=false checkout "${CI_COMMIT_SHA}"
        ) 2>&1

        test none = "${GIT_SUBMODULE_STRATEGY}" && {
          icon_ci_log_status_msg 'Skipping Git submodule setup'
        } || (
          icon_ci_log_status_msg 'Updating/initializing submodules '\
      ${submodule_recursive_flag:+'recursively '}"with git depth set to ${GIT_SUBMODULE_DEPTH}..."
          set -x
          git -C "${ICON_CI_UTILS_GIT_CLONE_PATH}" \
            submodule update --init ${submodule_recursive_flag} \
            --depth "${GIT_SUBMODULE_DEPTH}" ${GIT_SUBMODULE_UPDATE_FLAGS-} \
            ${GIT_SUBMODULE_PATHS:+--} ${GIT_SUBMODULE_PATHS-}
        ) 2>&1

        test none = "${GIT_STRATEGY}" || {
          test ! -d "${artifacts_backup_path}" || (
            icon_ci_log_status_msg 'Restoring artifacts from the backup...'
            set -x
            cp -afl "${artifacts_backup_path}/." "${CI_PROJECT_DIR}/"
            rm -rf "${artifacts_backup_path}"
          ) 2>&1
          icon_ci_log_section_end
        }
      )

# Implements a script that stages, commits, and pushes a specified file or directory
# back to the upstream repository branch.
#
# Jobs that extend the template must ensure that their runtime environments
# enable the git command.
#
.utils:git:push:
  variables:
    # Path to the root of the repository clone:
    ICON_CI_UTILS_GIT_CLONE_PATH: ${CI_PROJECT_DIR}

    # Relative (to $ICON_CI_UTILS_GIT_CLONE_PATH) path to a file or directory to
    # push:
    ICON_CI_UTILS_GIT_PUSH_REL_PATH: null
  script:
    - |
      # !reference [.utils:git:push, script]
      (
        set -u

        # Sanity checks:
        test -n "${ICON_CI_UTILS_GIT_PUSH_REL_PATH-}" || {
          icon_ci_log_fatal_msg 'ICON_CI_UTILS_GIT_PUSH_REL_PATH is not set'
        }

        test -e "${ICON_CI_UTILS_GIT_CLONE_PATH}/${ICON_CI_UTILS_GIT_PUSH_REL_PATH}" || {
          icon_ci_log_fatal_msg \
            "'${ICON_CI_UTILS_GIT_CLONE_PATH}/${ICON_CI_UTILS_GIT_PUSH_REL_PATH}' \
      does not exist"
        }

        branch=${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-${CI_COMMIT_BRANCH:-}}
        test -n "${branch}" || {
          icon_ci_log_fatal_msg \
            "Job '${CI_JOB_NAME}' can only run for merge request and branch \
      pipelines, i.e. when either the CI_MERGE_REQUEST_SOURCE_BRANCH_NAME or \
      the CI_COMMIT_BRANCH variable is set"
        }

        icon_ci_log_section_start \
          "Pushing '${ICON_CI_UTILS_GIT_PUSH_REL_PATH}' to branch '${branch}'" 'collapsed=false'
        (
          set -x
          git -C "${ICON_CI_UTILS_GIT_CLONE_PATH}" \
            -c safe.directory="${ICON_CI_UTILS_GIT_CLONE_PATH}" \
            add -- "${ICON_CI_UTILS_GIT_PUSH_REL_PATH}"

          git -C "${ICON_CI_UTILS_GIT_CLONE_PATH}" \
            -c safe.directory="${ICON_CI_UTILS_GIT_CLONE_PATH}" \
            -c user.name="${GITLAB_USER_NAME}" \
            -c user.email="${GITLAB_USER_EMAIL}" \
            commit --quiet --message "Update ${ICON_CI_UTILS_GIT_PUSH_REL_PATH}

      ${CI_JOB_URL}"

          git -C "${ICON_CI_UTILS_GIT_CLONE_PATH}" \
            -c safe.directory="${ICON_CI_UTILS_GIT_CLONE_PATH}" \
            push --quiet origin "HEAD:refs/heads/${branch}"
        ) 2>&1
        icon_ci_log_section_end
      )
  manual_confirmation: >-
    This job will create a new commit on the branch. Make sure to pull it before adding any further commits.
